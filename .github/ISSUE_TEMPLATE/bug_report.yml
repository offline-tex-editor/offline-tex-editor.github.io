name: Report a bug
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Paste error messages as text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Offline TeX Editor version
      description: "Shown by: offline-tex-editor --version"
  - type: input
    id: system
    attributes:
      label: Your system
      description: Operating system, TeX distribution and browser, for example Ubuntu 24.04, TeX Live 2024, Firefox 130.
